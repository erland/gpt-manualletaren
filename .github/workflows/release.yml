name: Release canonical distributions
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML jsonschema
      - name: Validate canonical project and domain
        run: |
          python3 scripts/lint_gpt_project.py --project-root .
          python3 scripts/validate_project.py
          python3 -m unittest discover -s tests -v
      - name: Build and validate canonical distribution
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf build dist
          python3 scripts/build_distributions.py --project-root . --version "$VERSION"
          python3 scripts/validate_distributions.py --project-root .
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          p=Path('dist')
          manifest=json.loads((p/'DELIVERY-MANIFEST.json').read_text())
          files=list(p.glob('*.zip'))
          assert len(files)==6, [x.name for x in files]
          for archive in files:
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None, archive
          print('All six ZIP archives verified')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/DELIVERY-MANIFEST.json
            dist/SHA256SUMS
