name: Release project ZIP
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_project.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build.py --version "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ../manualletaren-project-*.zip
            dist/*.zip
            dist/manifest.json
